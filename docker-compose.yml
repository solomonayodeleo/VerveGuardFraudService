version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verveguard_db
    environment:
      POSTGRES_USER: verve_user
      POSTGRES_PASSWORD: verve_password
      POSTGRES_DB: verveguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8.6-alpine
    container_name: verveguard_redis
    ports:
      - "6379:6379"
      -
volumes:
  pgdata: