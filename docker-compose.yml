version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verveguard_db
    environment:
      POSTGRES_USER: verve_user
      POSTGRES_PASSWORD: verve_password
      POSTGRES_DB: verveguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8.6-alpine
    container_name: verveguard_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: verveguard_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: verveguard_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata: