# Server configuration
spring.application.name=VerveGuardFraudService
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/verveguard
spring.datasource.username=verve_user
spring.datasource.password=verve_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway migrations Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security Configuration
verveguard.security.hash-salt=VERVE_GUARD_SECRET_SALT_2026
verveguard.security.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379


# --- ACTUATOR (OBSERVABILITY) ---
# Expose the health and metrics endpoints to the web
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always

# --- SIGNOZ / OPENTELEMETRY ---
management.tracing.sampling.probability=1.0

# Tell Spring Boot where the SigNoz OTLP receiver is listening
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.endpoint=http://localhost:4318/v1/metrics

# --- CIRCUIT BREAKER: REDIS ---
resilience4j.circuitbreaker.instances.redis.sliding-window-size=5
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=30s

# --- CIRCUIT BREAKER: DATABASE ---
resilience4j.circuitbreaker.instances.database.sliding-window-size=5
resilience4j.circuitbreaker.instances.database.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.database.wait-duration-in-open-state=30s




